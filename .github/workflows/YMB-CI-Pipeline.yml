# This CI pipeline creates an auditable record of every code change,
# including who made the change, when it was made, and whether automated
# testing passed before deployment. This helps address Ben Secure's concern
# that YMB cannot demonstrate configuration and change history during an audit.
#
# By automatically testing all changes on pushes and pull requests, the
# pipeline supports OSFI expectations for controlled, documented, and
# traceable system changes. The GitHub Actions logs provide evidence that
# changes were reviewed and validated before reaching production.

name: YMB Banking App CI Pipeline
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
 
      - name: Run pytest
        run: pytest test_main.py -v
